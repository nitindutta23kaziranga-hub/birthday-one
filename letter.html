<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Special Surprise For You ✨</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    background: linear-gradient(135deg, #f8e1f4, #e0c3f7, #c2e6ff);
    background-size: 400% 400%;
    animation: gradientBackground 15s ease infinite;
}

.container {
    max-width: 800px;
    margin: auto;
    padding: 20px;
    text-align: center;
}

h1 {
    color: #6a4c93;
    margin-bottom: 20px;
}

.letter-container {
    background: rgba(255,255,255,0.8);
    padding: 25px;
    border-radius: 15px;
    margin-bottom: 30px;
}

.video-container {
    display: none;
    margin-top: 20px;
}

video {
    width: 100%;
    border-radius: 15px;
}

.surprise-button {
    padding: 15px 35px;
    font-size: 18px;
    border: none;
    border-radius: 30px;
    background: #ff8fab;
    color: white;
    cursor: pointer;
    transition: 0.3s;
}

.surprise-button:hover {
    transform: scale(1.1);
}

.back-button {
    display: inline-block;
    margin-top: 20px;
    padding: 10px 20px;
    border: 2px solid #6a4c93;
    border-radius: 30px;
    text-decoration: none;
    color: #6a4c93;
}

@keyframes gradientBackground {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}
</style>
</head>

<body>

<div class="container">
    <h1>For My Dearest Friend ❤️</h1>

    <div class="letter-container">
        <p id="typed-text"></p>
    </div>

    <button class="surprise-button" onclick="playVideo()">
        Click for a Video 🎥
    </button>

    <div class="video-container" id="videoBox">
        <video id="myVideo" controls>
            <source src="VID-20260503-WA0000.mp4" type="video/mp4">
        </video>
    </div>

    <br>
    <a href="javascript:history.back()" class="back-button">← Back to Birthday Cake</a>
</div>

<!-- Scripts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/typed.js/2.0.12/typed.min.js"></script>

<script>
// Typing effect
const text = "My dearest friend,\n\nYou make my life brighter just by being in it. Every moment with you feels special, and I just want to say thank you for being you.\n\nHappy Birthday ❤️\n\nJust… keep smiling like this, okay?";

new Typed("#typed-text", {
    strings: [text],
    typeSpeed: 30,
    showCursor: true
});

// Video play
function playVideo() {
    const box = document.getElementById("videoBox");
    const video = document.getElementById("myVideo");

    box.style.display = "block";
    video.scrollIntoView({ behavior: "smooth" });
    video.play();
}
</script>

</body>
</html>
