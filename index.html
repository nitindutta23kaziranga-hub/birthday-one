<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Gurl!</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Comic Sans MS', cursive, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 2rem;
            max-width: 800px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            backdrop-filter: blur(5px);
            box-shadow: 0 8px 32px rgba(255, 105, 180, 0.3);
            transition: all 0.5s ease;
        }

        h1 {
            font-size: 3.5rem;
            color: #FF1493;
            text-shadow: 2px 2px 8px rgba(255, 255, 255, 0.8);
            margin-bottom: 1.5rem;
            opacity: 0;
            animation: bounce-in 1.5s forwards 0.5s;
        }

        .subtitle {
            font-size: 1.8rem;
            color: #8A2BE2;
            margin-bottom: 2rem;
            opacity: 0;
        }

        .next-button {
            padding: 1rem 3rem;
            font-size: 1.5rem;
            background: linear-gradient(45deg, #FF1493, #8A2BE2);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 20, 147, 0.5);
            transition: all 0.3s ease;
            opacity: 0;
            animation: fade-in 1s forwards 3s;
        }

        .audio-controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
        }

        .confetti, .balloon, .heart, .star {
            position: absolute;
            z-index: 1;
        }

        @keyframes bounce-in {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes fade-in {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
</head>

<body>

<div class="container">
    <!-- ✅ ONLY THIS LINE CHANGED -->
    <h1>Happy Birthday Gurl! 🎉🎂</h1>

    <div class="subtitle">
        Hey Bestie! Ready for your special surprise? Click to continue!
    </div>

    <button class="next-button" onclick="goToNextPage()">Let's Go! ✨</button>
</div>

<script>
function goToNextPage() {
    window.location.href = "memorylane.html";
}

// keep animations same
function createFloatingElements() {
    const elements = ['🎈','✨','❤️','★'];

    for (let i = 0; i < 50; i++) {
        let el = document.createElement("div");
        el.innerHTML = elements[Math.floor(Math.random()*elements.length)];
        el.style.position = "absolute";
        el.style.left = Math.random()*100 + "vw";
        el.style.top = "-20px";
        el.style.fontSize = (Math.random()*30+15)+"px";

        document.body.appendChild(el);

        let duration = Math.random()*5+5;

        el.animate([
            { transform: "translateY(0)" },
            { transform: "translateY(110vh)" }
        ], {
            duration: duration*1000,
            iterations: 1
        });

        setTimeout(()=>el.remove(), duration*1000);
    }
}

setInterval(createFloatingElements, 2000);
</script>

</body>
</html>
